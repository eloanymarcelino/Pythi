{id:"oce",t:"Oceano",c:0,l:["#d4f1ff","#b5dcff"],d:["#08233d","#0f4a6e"],s:d=>`<path d='M80 0L20 800H170ZM230 0L200 800H330ZM330 0L360 800H400Z' fill='#fff' opacity='${d?.06:.18}'/><g fill='none' stroke='#fff' stroke-width='2.5' opacity='.6'><circle cx='70' cy='300' r='10'/><circle cx='95' cy='250' r='6'/><circle cx='320' cy='420' r='12'/><circle cx='345' cy='360' r='7'/><circle cx='150' cy='500' r='8'/></g><g fill='${d?"#ffb35c":"#ff8f5c"}'><ellipse cx='260' cy='330' rx='24' ry='12'/><path d='M282 330l22-12v24z'/><ellipse cx='110' cy='440' rx='18' ry='9'/><path d='M126 440l16-9v18z'/></g><circle cx='252' cy='326' r='2.5' fill='#fff'/><circle cx='104' cy='437' r='2' fill='#fff'/><path d='M0 640Q70 610 140 640T280 640T400 630V800H0Z' fill='#1b6fa8' opacity='${d?.35:.22}'/><path d='M0 690Q80 665 160 692T320 690T400 682V800H0Z' fill='#0e4f86' opacity='${d?.5:.3}'/><path d='M0 745Q90 722 180 746T360 744T400 740V800H0Z' fill='#08335c' opacity='${d?.7:.4}'/><path d='M50 800q-6-60 6-110M64 800q8-50-4-90M340 800q-8-70 8-130M355 800q10-40 0-80' stroke='#2fa36b' stroke-width='6' fill='none' stroke-linecap='round' opacity='.7'/>`},
{id:"doc",t:"Doces",c:0,l:["#ffe0f1","#fff3c4"],d:["#3a1530","#4a2a1a"],s:d=>{const q=rng(),C=["#ff7eb6","#ffd43b","#7ad7ff","#9be37a","#c79bff"];let f="";for(let i=0;i<46;i++)f+=`<rect x='${q()*400|0}' y='${q()*800|0}' width='12' height='4' rx='2' fill='${C[i%5]}' opacity='.75' transform='rotate(${q()*180|0} 200 400)'/>`;const lp=(x,y,r,c)=>`<rect x='${x-3}' y='${y}' width='6' height='${130}' rx='3' fill='#fff' opacity='.8'/><circle cx='${x}' cy='${y}' r='${r}' fill='${c}'/><path d='M${x} ${y}m-${r*.7} 0a${r*.7} ${r*.7} 0 1 1 ${r*1.4} 0a${r*.35} ${r*.35} 0 1 1-${r*.7} 0' stroke='#fff' stroke-width='5' fill='none' opacity='.85'/>`;return `<circle cx='60' cy='140' r='70' fill='#ff7eb6' opacity='${d?.28:.3}'/><circle cx='350' cy='260' r='90' fill='#7ad7ff' opacity='${d?.22:.3}'/><circle cx='120' cy='470' r='50' fill='#ffd43b' opacity='${d?.25:.35}'/>${f}${lp(90,560,44,"#ff7eb6")}${lp(310,610,38,"#7ad7ff")}<path d='M0 730Q50 690 100 730T200 730T300 730T400 730V800H0Z' fill='#ff7eb6' opacity='${d?.55:.6}'/><path d='M0 760Q50 725 100 760T200 760T300 760T400 760V800H0Z' fill='#fff' opacity='${d?.35:.7}'/>`}},
{id:"gal",t:"Galáxia",c:0,l:["#e6dcff","#cdd7ff"],d:["#120c2e","#2c1b5e"],s:d=>{const q=rng();let f="";for(let i=0;i<70;i++)f+=`<circle cx='${q()*400|0}' cy='${q()*800|0}' r='${.6+q()*1.8}' fill='${d?"#fff":"#6a58c8"}' opacity='${.35+q()*.6}'/>`;return `<ellipse cx='120' cy='200' rx='170' ry='90' fill='#a05cff' opacity='${d?.22:.18}' transform='rotate(-20 120 200)'/><ellipse cx='320' cy='520' rx='150' ry='80' fill='#ff5cae' opacity='${d?.18:.15}' transform='rotate(25 320 520)'/><ellipse cx='150' cy='700' rx='180' ry='70' fill='#4aa8f0' opacity='${d?.2:.15}'/>${f}<circle cx='290' cy='180' r='50' fill='#ff9a5c' opacity='.95'/><path d='M250 170Q290 150 330 168M246 195Q290 178 334 192' stroke='#fff' stroke-width='5' opacity='.35' fill='none'/><ellipse cx='290' cy='180' rx='86' ry='14' fill='none' stroke='#ffe3a8' stroke-width='5' opacity='.8' transform='rotate(-18 290 180)'/><circle cx='80' cy='560' r='26' fill='#c9d3ff' opacity='.9'/><circle cx='72' cy='552' r='5' fill='#8c9ae0' opacity='.7'/><circle cx='90' cy='568' r='7' fill='#8c9ae0' opacity='.6'/><path d='M0 780Q100 740 200 770T400 755V800H0Z' fill='#3a2a8a' opacity='${d?.6:.3}'/>`}}];

window.bgapply=()=>{const b=cur();if(!b||!b.l){bs.textContent="";return}const c=dk()?b.d:b.l;bs.textContent=`body{--bg:${c[0]}}body::before{background:${uri(b)} left bottom/auto 100% repeat-x,linear-gradient(160deg,${c[0]},${c[1]})!important}`};

const BGH=()=>{const cb=S.cb||0,o=S.bgs||[];return `<h2 style="margin-top:22px">🎨 Fundos do jogo</h2><p>Fundos liberados de graça para teste! No modo automático o fundo muda a cada mundo concluído!</p><div class=card><b>🔄 Automático por mundo</b><p>Mundos concluídos: ${wd()}/${WD.length}. Usa seus fundos em sequência.</p><button class=go ${own().length<2||S.bga?"disabled":""} onclick="pyBg('auto')">${S.bga?"ATIVADO":"ATIVAR"}</button></div><div class=cxbg>`+[{id:"",t:"Padrão",c:0}].concat(BG).map(b=>{const ow=!b.c||o.includes(b.id),eq=!S.bga&&(S.bg||"")==b.id,l=(dk()?b.d:b.l)||["#f2f6fb","#dbe4f0"];return `<div class=card style="flex:1 1 140px"><div class=cxsw style="background:${b.s?uri(b)+" left bottom/auto 100% repeat-x,":""}linear-gradient(160deg,${l[0]},${l[1]})"></div><b>${b.t}</b><button class=go ${eq||(!ow&&cb<b.c)?"disabled":""} onclick="pyBg('${b.id}')">${eq?"EM USO":ow?"USAR":"🐍 "+b.c+" · COMPRAR"}</button></div>`}).join("")+"</div>"};

/* ---- chat com o Pythi (IA) ---- */
let H=[],busy=0;const D=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const fmt=t=>String(t).split("```").map((p,i)=>i%2?code(p.replace(/^\w*\n/,"").trim()):he(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>")).join("");
const scr=()=>scrollTo(0,document.body.scrollHeight);
const add=(c,t)=>{const d=document.createElement("div");d.className="cxb "+c;d.innerHTML=fmt(t);$("#cxm").append(d);scr();return d};
const sys=()=>{const i=WD.findIndex(w=>w.L.includes(P[S.n])),f=P[S.n];return `Você é o Pythi, a cobrinha mascote do Python Quest, app de ensino de Python do IFPB. Responda sempre em português do Brasil, de forma amigável e curta (até uns 8 linhas), emojis com moderação, sem tabelas nem títulos markdown. Ajude com Python (comparações, if/elif/else, for, strings, funções, try/except, random, math): explique e dê dicas sem entregar a resposta pronta de exercícios do jogo. Também é planejador de estudos: quando o aluno informar a agenda acadêmica e os horários livres, monte um cronograma semanal usando linhas como "- Seg 14:00–14:50 · atividade", só dentro dos horários livres informados, priorizando provas e entregas mais próximas, com blocos de 25 a 50 minutos e pausas, pelo menos um bloco por semana para fases do Python Quest (diga qual) e um dia leve; termine com uma dica. Se faltar informação essencial, faça uma única pergunta.\nContexto do aluno: nome ${S.nm||"não informado"}; hoje é ${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}; fases concluídas ${S.n} de ${NP}; ${f==null?"jogo concluído":"próxima fase: "+N[f][1]+" (Mundo "+(i+1)+")"}; XP ${S.xp}; cobras ${S.cb||0}.`};
window.pyChat=()=>{clearInterval(ti);sh("");$("#app").innerHTML=`<div class=tp><button class=x onclick="home()">✕</button><b>💬 Conversa com o Pythi</b></div><div class=ib><div class="mas ms">${MSC()}</div><div class=bub>Oi${S.nm?", "+he(S.nm.split(" ")[0]):""}! Sou o Pythi 🐍 Tiro dúvidas de Python e monto seu cronograma de estudos com a sua agenda.</div></div><div class=cxch><button onclick="pyPlan()">📅 Montar cronograma</button><button onclick="pySend('O que eu devo revisar antes da minha próxima fase?')">💡 O que revisar?</button></div><div id=cxp></div><div class=cxm id=cxm></div><div class=cxin><textarea id=cxt rows=1 placeholder="Pergunte ao Pythi..."></textarea><button class=cxs onclick="pySend()" aria-label="Enviar">➤</button></div>`;H.forEach(m=>add(m.role=="user"?"u":"p",m.content));$("#cxt").addEventListener("input",e=>{e.target.style.height="46px";e.target.style.height=Math.min(120,e.target.scrollHeight)+"px"});$("#cxt").addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();pySend()}});scrollTo(0,0)};
window.pySend=async txt=>{const el=$("#cxt"),v=(txt||(el?el.value:"")).trim();if(!v||busy)return;if(el&&!txt){el.value="";el.style.height="46px"}H.push({role:"user",content:v});add("u",v);busy=1;const b=add("p","…");
try{const sm=window.claude&&await claude.use("sample");if(!sm)throw{code:"none"};let m=H.slice(-12).map(x=>({...x}));while(m.length&&m[0].role!="user")m.shift();m[0].content=sys()+"\n\n---\nConversa:\n"+m[0].content;
const r=await sm(m,{cache:false,onText:({text})=>{b.innerHTML=fmt(text);scr()}});H.push({role:"assistant",content:r.text});b.innerHTML=fmt(r.text)}
catch(e){H.pop();b.innerHTML=e&&e.code=="not_granted"?"Preciso da sua permissão para conversar. Toque em enviar de novo e aceite 🐍":e&&e.code=="rate_limited"?"Estou recebendo mensagens demais. Espere um pouquinho e tente de novo 😅":"A IA só funciona na versão publicada no Claude, e não consegui falar agora 😅 Tente de novo."}
busy=0;scr()};
window.pyPlan=()=>{const f=S.free||{};$("#cxp").innerHTML=`<div class=card><b>📅 Cronograma de estudos</b><p>Conte sua agenda acadêmica (provas, trabalhos, aulas) e marque os horários em que pode estudar.</p><textarea class=cxa id=cxa rows=4 placeholder="Ex.: prova de Matemática dia 20/11; trabalho de Física até 25/11; aulas de manhã">${he(S.agenda||"")}</textarea><p><b>Horários disponíveis</b></p><div class=cxd>${D.map((d,i)=>{const x=f[i]||{};return `<input type=checkbox id=cd${i} ${x.on?"checked":""}><label for=cd${i}>${d}</label><input type=time id=ci${i} value="${x.a||"14:00"}"><input type=time id=cf${i} value="${x.b||"16:00"}">`}).join("")}</div><p id=cxe style="color:var(--rdt)"></p><button class=go onclick="pyGo()">GERAR CRONOGRAMA</button></div>`;$("#cxp").scrollIntoView({block:"start"})};
window.pyGo=()=>{const ag=$("#cxa").value.trim(),f={},l=[];D.forEach((d,i)=>{const on=$("#cd"+i).checked,a=$("#ci"+i).value,b=$("#cf"+i).value;f[i]={on,a,b};if(on&&a&&b)l.push(d+" "+a+" às "+b)});if(!l.length){$("#cxe").textContent="Marque pelo menos um dia com horário livre.";return}
S.agenda=ag;S.free=f;save();$("#cxp").innerHTML="";pySend("Monte meu cronograma semanal de estudos.\nAgenda acadêmica: "+(ag||"(não informei nada específico)")+"\nHorários livres: "+l.join("; "))};
})();

login();

(()=>{const ok=t=>{const e=t&&t.nodeType==3?t.parentElement:t;try{return !!(e&&e.closest&&e.closest("input,textarea,#rt,[data-sel]"))}catch(x){return false}},bl=e=>{if(!ok(e.target))e.preventDefault()};["copy","cut","selectstart","contextmenu","dragstart"].forEach(n=>document.addEventListener(n,bl,true))})();
